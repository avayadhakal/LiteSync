# LiteSync Configuration Template
# Copy this file to config.toml and edit. chmod 600 config.toml once it
# contains real password hashes.

# Directories the app is allowed to browse and transfer between.
# Every browse/transfer path must resolve inside one of these.
# Examples below are illustrative; configure paths matching your drives/mounts:
allowed_roots = [
    "/mnt/storage",
    "/mnt/usb",
]

# Random secret used to sign session cookies. Generate with:
# python -c "import secrets; print(secrets.token_hex(32))"
secret_key = "REPLACE_ME_WITH_A_RANDOM_SECRET"

# Session cookie lifetime, in seconds. Default: 7 days (604800 seconds).
session_max_age = 604800

# Signed download URL lifetime, in seconds. Default: 24 hours (86400 seconds).
download_expiry = 86400

# Optional dedicated secret key for download URL signing.
# If omitted, a distinct key is derived automatically from secret_key.
# download_secret_key = "OPTIONAL_SEPARATE_DOWNLOAD_SECRET"

# Maximum browser upload size in megabytes. Default: 5120 (5 GB).
# NOTE: The server spools large uploads to a temporary directory inside data_dir 
# (e.g. data/tmp) before moving them to their final destination. Ensure the disk 
# hosting data_dir has sufficient free space to hold max_upload_size_mb.
# max_upload_size_mb = 5120

# Set true only if the app is served over HTTPS.
secure_cookie = false

# Where the sqlite db and per-task logs are stored.
data_dir = "./data"

# Server bind host and port
host = "0.0.0.0"
port = 8000

# Configure one or more users.
# Generate a hash with: python -m app.auth hash "yourpassword"
[[users]]
username = "admin"
password_hash = "$2b$12$REPLACE_ME_WITH_A_REAL_BCRYPT_HASH"
