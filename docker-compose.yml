services:
  litesync:
    image: avayadhakal/litesync:latest
    container_name: litesync
    restart: unless-stopped
    # Run as host user to ensure permission to write to host mounts
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      # Use a local folder instead of a docker named volume so the host user owns it
      - ./data:/data
      # Mount your configuration file into the container.
      - ./config.toml:/data/config.toml:ro
      # Host storage mounts (Host Path : Container Path)
      # Examples:
      # - /mnt/movies:/movies       
      # - /home/user/dl:/downloads  
    environment:
      # Optional: set the web port (default: 8000). If you change the host-side port in "ports:" above
      # (e.g. "9000:8000"), set LITESYNC_PORT to match your host port (9000) for CSRF validation.
      - LITESYNC_PORT=8000
      # Optional: override the max upload size in MB (default: 5120 MB / 5 GB).
      # - LITESYNC_MAX_UPLOAD_SIZE_MB=10240
      # The container-side paths from the volumes section MUST be listed here,
      # separated by colons (:). This overrides any allowed_roots in config.toml.
      # Ensure you include all directories you want the browser to access.
      - LITESYNC_ALLOWED_ROOTS=/mnt/movies:/home/user/dl
