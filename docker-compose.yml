services:
  litesync:
    build: .
    image: litesync:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # The persistent volume for LiteSync's database, task logs, and temporary files.
      - litesync_data:/data
      # Mount your configuration file into the container.
      # Create a config.toml on your host (e.g. copied from config.example.toml)
      # and mount it here. The application does not hot-reload, so restarts are required for config changes.
      - ./config.toml:/data/config.toml:ro
      # ----------------------------------------------------------------------------------
      # HOST DIRECTORY MOUNTS (CRITICAL)
      # ----------------------------------------------------------------------------------
      # Map host directories to container paths here, and ensure the container paths are listed
      # in the LITESYNC_ALLOWED_ROOTS environment variable below.
      #
      # The left side (before the colon) is the path on your host machine.
      # The right side (after the colon) is the path inside the container.
      #
      # Examples:
      # - /mnt/movies:/movies       
      # - /home/user/dl:/downloads  
      #
      # - /path/to/host/dir:/container/path
    environment:
      # Optional: set the web port (default: 8000). If you change the host-side port in "ports:" above
      # (e.g. "9000:8000"), set LITESYNC_PORT to match your host port (9000) for CSRF validation.
      - LITESYNC_PORT=8000
      # The container-side paths from the volumes section MUST be listed here,
      # separated by colons (:). This overrides any allowed_roots in config.toml.
      #
      # Example matching the commented volumes above:
      # - LITESYNC_ALLOWED_ROOTS=/movies:/downloads
      - LITESYNC_ALLOWED_ROOTS=

volumes:
  litesync_data:
    # This creates a named volume managed by Docker for persistent application data.
