<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiteSync</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header>
    <h1>LiteSync</h1>
    <div>
      <span id="whoami" style="color: var(--text-dim); margin-right: 12px;"></span>
      <button id="logout-btn">Log out</button>
    </div>
  </header>

  <div class="panes">
    <section class="pane" id="source-pane">
      <div class="pane-header">
        <span>Source</span>
        <span class="pane-path" id="source-path"></span>
      </div>
      <div class="pane-body" id="source-body"></div>
    </section>
    <div id="vertical-splitter" class="splitter-v"></div>
    <section class="pane" id="dest-pane">
      <div class="pane-header">
        <span>Destination</span>
        <span class="pane-path" id="dest-path"></span>
        <button id="new-folder-btn" class="icon-btn" title="New Folder">📁+ New Folder</button>
      </div>
      <div class="pane-body" id="dest-body"></div>
    </section>
  </div>

  <div class="controls">
    <label><input type="checkbox" id="delete-checkbox" /> Delete source files after successful copy</label>
    <span class="spacer"></span>
    <span id="selection-count" style="color: var(--text-dim);"></span>
    <button id="transfer-btn" class="primary" disabled>Transfer</button>
  </div>

  <div id="horizontal-splitter" class="splitter-h"></div>
  <div class="history">
    <div class="tabs-bar">
      <button class="tab-btn active" id="tab-active-btn">Active Transfers</button>
      <button class="tab-btn" id="tab-history-btn">Transfer History</button>
      <span class="spacer" style="flex: 1;"></span>
      <button class="btn-sm btn-danger hidden" id="clear-history-btn">Clear All</button>
    </div>
    <div id="active-transfers-container" class="cards-container"></div>
    <table id="history-table" class="hidden">
      <thead>
        <tr><th>Started</th><th>Source(s)</th><th>Destination</th><th>Status</th><th style="width: 80px; text-align: right;">Actions</th></tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>




  <div class="modal-backdrop hidden" id="confirm-modal">
    <div class="modal">
      <h2>Are you sure you want to transfer the selected items?</h2>
      <ul id="confirm-list"></ul>
      <div>Destination: <span id="confirm-dest" style="color: var(--text-dim);"></span></div>
      <div class="actions">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok" class="primary">Transfer</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
